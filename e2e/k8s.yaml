apiVersion: v1
kind: Namespace
metadata:
  name: rmd-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: rmd-test
spec:
  replicas: 1
  selector: {matchLabels: {app: gitlab}}
  template:
    metadata: {labels: {app: gitlab}}
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:19.5.6-ce.0
          ports: [{containerPort: 80}]
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.rmd-test.svc.cluster.local'
                gitlab_rails['initial_root_password'] = 'RmdTest-Only-2026!x'
                prometheus_monitoring['enable'] = false
                puma['worker_processes'] = 0
                sidekiq['concurrency'] = 5
                gitlab_rails['gitlab_kas_enabled'] = false
                gitlab_kas['enable'] = false
                registry['enable'] = false
                gitlab_rails['usage_ping_enabled'] = false
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {memory: 6Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/gitlab}
            - {name: logs, mountPath: /var/log/gitlab}
            - {name: data, mountPath: /var/opt/gitlab}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: config, emptyDir: {}}
        - {name: logs, emptyDir: {}}
        - {name: data, emptyDir: {}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: gitlab, namespace: rmd-test}
spec:
  selector: {app: gitlab}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: firefox, namespace: rmd-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: firefox}}
  template:
    metadata: {labels: {app: firefox}}
    spec:
      containers:
        - name: firefox
          image: selenium/standalone-firefox:157.0-20261101
          ports: [{containerPort: 4444}]
          env:
            - {name: SE_NODE_SESSION_TIMEOUT, value: "1800"}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {memory: 3Gi}
          volumeMounts: [{name: shm, mountPath: /dev/shm}]
      volumes:
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: firefox, namespace: rmd-test}
spec:
  selector: {app: firefox}
  ports: [{port: 4444, targetPort: 4444}]
